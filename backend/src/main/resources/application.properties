server.port=18080
spring.application.name=vizard

# Serve the separate frontend/ folder directly (run the backend from the backend/ folder).
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
spring.web.resources.cache.period=0

# ---- Execution limits (per run) ----
vizard.execution.timeout-ms=5000
vizard.execution.max-heap-mb=128
vizard.execution.max-output-bytes=65536
vizard.execution.max-concurrent-runs=2

# ---- Step-by-step tracing (Milestone 2) ----
# Tracing runs under a debugger, so it is slower and gets a longer limit.
vizard.execution.trace-timeout-ms=15000
vizard.execution.max-trace-steps=3000

# Traces can be several MB of repetitive JSON: compress them and leave out null fields.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048
spring.jackson.default-property-inclusion=non_null
