server.port=18080
spring.application.name=vizard

# Serve the separate frontend/ folder directly (run the backend from the backend/ folder).
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
spring.web.resources.cache.period=0

# ---- Execution limits (per run) ----
vizard.execution.timeout-ms=5000
vizard.execution.max-heap-mb=128
vizard.execution.max-output-bytes=65536
vizard.execution.max-concurrent-runs=2
